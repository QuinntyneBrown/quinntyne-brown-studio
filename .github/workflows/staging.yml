name: Deploy studio release to staging
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Verify workflow run ID containing the release artifact
        required: true
        type: string
      sha:
        description: Full commit SHA to deploy
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: studio-staging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: studio-release
          path: .artifacts/release
      - name: Confirm the requested immutable release
        shell: bash
        run: test -f ".artifacts/release/${{ inputs.sha }}.tar.gz"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload and activate the release
        id: release
        env:
          GITHUB_SHA: ${{ inputs.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          QBS_RESOURCE_GROUP: ${{ vars.QBS_RESOURCE_GROUP }}
          QBS_VM_NAME: ${{ vars.QBS_VM_NAME }}
          QBS_DEPLOYMENT_NAME: qbs-staging
        run: python deploy/deploy-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Verify the served staging studio
        working-directory: e2e
        env:
          QBS_PRODUCTION_ORIGIN: ${{ steps.release.outputs.origin }}
          QBS_PRODUCTION_REDIRECTS: ${{ steps.release.outputs.redirects }}
          QBS_PRODUCTION_CLIENT_REDIRECT: ${{ steps.release.outputs.client_redirect }}
        run: npm run test:production
