name: Verify and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: dotnet restore backend/Qbs.slnx --locked-mode
      - run: dotnet build backend/Qbs.slnx -c Release --no-restore
      - run: dotnet test backend/Qbs.slnx -c Release --no-build --logger trx --results-directory .artifacts/acceptance
      - run: npm ci
        working-directory: frontend
      - run: npm run build:apps
        working-directory: frontend
      - run: npm run build:libs
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - run: python scripts/verify-architecture.py
      - run: python docs/detailed-designs/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            .artifacts/acceptance
            e2e/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: static-applications
          path: frontend/dist
  design-system:
    name: Design system contract and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
        working-directory: design-system
      - run: npx playwright install --with-deps chromium
        working-directory: design-system
      - run: npm test
        working-directory: design-system
      - run: npm run build
        working-directory: design-system
      - run: npm run check:artifact
        working-directory: design-system
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-catalog
          path: design-system/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-system-evidence
          path: design-system/test-results

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t qbs-api:${{ github.sha }} .
      - run: docker build -f deploy/Dockerfile.worker -t qbs-worker:${{ github.sha }} .
      - run: docker build -f deploy/Dockerfile.gateway -t qbs-gateway:${{ github.sha }} .
      - run: docker save qbs-api:${{ github.sha }} qbs-worker:${{ github.sha }} qbs-gateway:${{ github.sha }} | gzip > qbs-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: qbs-images.tar.gz
