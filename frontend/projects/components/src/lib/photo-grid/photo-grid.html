<div class="photo-grid">
  @for (photo of photos(); track photo.id) {
    <figure class="photo-grid__tile">
      <button
        class="photo-grid__open"
        (click)="open(photo, $event)"
        [disabled]="!photo.url"
        [attr.aria-label]="'View ' + photo.name"
      >
        @if (photo.url && !failed().includes(photo.id)) {
          <img [src]="photo.thumbnailUrl || photo.url" [alt]="photo.name" loading="lazy" (error)="fail(photo.id)" />
        } @else {
          <span>{{
            failed().includes(photo.id) ? 'Photo unavailable' : photo.state || 'Unavailable photo'
          }}</span>
        }
      </button>
      <figcaption class="photo-grid__caption">{{ photo.name }}</figcaption>
      @if (selectable()) {
        <label class="photo-grid__selection"
          ><input
            type="checkbox"
            [checked]="selected().includes(photo.id)"
            (change)="selection.emit(photo.id)"
            [attr.aria-label]="'Select ' + photo.name"
          />Select</label
        >
      }
    </figure>
  }
</div>
